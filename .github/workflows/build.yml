name: Build and Deploy

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'seenical-language-upgrade-'))
    runs-on: ubuntu-latest
    concurrency:
      group: build-lock-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'true'

    - run: git tag --list
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '10'

    - name: Restore GitBook CLI
      uses: actions/cache@v4
      with:
        path: .gitbook-cli
        key: seenical-gitbook-cli-${{ runner.os }}-node10-2.3.2

    - name: Restore GitBook dependencies
      id: gitbook-dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gitbook
          node_modules
        key: seenical-gitbook-${{ runner.os }}-${{ hashFiles('book.json', '*/book.json', 'LANGS.md') }}

    - name: Prepare GitBook CLI
      run: |
        echo "${{ github.workspace }}/.gitbook-cli/node_modules/.bin" >> "$GITHUB_PATH"
        if [[ ! -x .gitbook-cli/node_modules/.bin/gitbook ]]; then
          npm install --prefix .gitbook-cli gitbook-cli@2.3.2 --no-audit --no-fund
        fi

    - name: Install GitBook Deps
      if: steps.gitbook-dependencies.outputs.cache-hit != 'true'
      run: gitbook install

    - name: Build and package GitBook
      env:
        SEENICAL_PREVIEW_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      run: make package

    - name: Save preview for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: seenical-site-preview
        path: book.tar.gz

    - name: Determine last tag
      if: github.event_name == 'push'
      id: last_tag_commit
      run: |
        set -x
        # 获取最后一个标签
        LAST_TAG=$(git describe --tags --abbrev=0 || echo '1.0.0')

        # 获取最后一个提交的哈希
        COMMIT_HASH=$(git rev-parse HEAD)
        COMMIT_HASH_SHORT=$(git rev-parse --short HEAD)

        # 解析主版本号
        MAJOR_VERSION=$(echo $LAST_TAG | cut -d. -f1)

        # 解析次版本号
        MINOR_VERSION=$(echo $LAST_TAG | cut -d. -f2)

        # 解析修订号
        PATCH_VERSION=$(echo $LAST_TAG | cut -d. -f3)

        # 增加修订号
        NEW_PATCH_VERSION=$((PATCH_VERSION + 1))

        # 创建新标签
        NEW_TAG="${MAJOR_VERSION}.${MINOR_VERSION}.${NEW_PATCH_VERSION}.${COMMIT_HASH_SHORT}"
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
        echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV

    - name: Create Release
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "book.tar.gz"
        tag: ${{ env.NEW_TAG }}
        commit: ${{ env.COMMIT_HASH }}

    - name: Request site deployment
      id: deploy
      if: github.event_name == 'push'
      run: |
        payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$NEW_TAG" \
          '{status:"ok", repository:$repo, release:$tag, return_run_details:true}')
        # Submit once. A lost response does not mean that dispatch failed.
        if ! reply=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 180 \
          -H 'Content-Type: application/json' --data "$payload" \
          'https://connector.lanyingim.com/grow_ai/release_finish'); then
          echo "::error::Could not confirm deployment submission for $NEW_TAG. Check the deployment history before retrying."
          exit 1
        fi
        if ! jq -se 'length == 1 and (.[0] | .code == 200 and .data.success == true)' <<< "$reply" >/dev/null; then
          echo "Deployment request rejected for $NEW_TAG" >&2
          jq -r '.message // "Unexpected Connector response"' <<< "$reply" >&2
          exit 1
        fi
        run_id=$(jq -r '.data.workflow_run_id | select(type == "number")' <<< "$reply")
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Wait for site deployment
      if: github.event_name == 'push'
      timeout-minutes: 16
      env:
        RUN_ID: ${{ steps.deploy.outputs.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::Deployment accepted for $NEW_TAG, but this Connector returned no run ID. Check https://github.com/maxim-top/im.gitbook/actions/workflows/deploy_sub_site.yml before retrying."
          exit 1
        fi
        run_url="https://github.com/maxim-top/im.gitbook/actions/runs/$RUN_ID"
        echo "Waiting for $NEW_TAG: $run_url"
        auth=(-H "Authorization: Bearer $GH_TOKEN")
        failures=0
        while (( SECONDS < 900 )); do
          status=$(curl -sS "${auth[@]}" --connect-timeout 5 --max-time 10 -o "$RUNNER_TEMP/deploy-run.json" \
            -w '%{http_code}' "https://api.github.com/repos/maxim-top/im.gitbook/actions/runs/$RUN_ID") || status=000
          if [[ "$status" == 200 ]] && state=$(jq -er '.status' "$RUNNER_TEMP/deploy-run.json"); then
            failures=0
            if [[ "$state" == completed ]]; then
              conclusion=$(jq -r '.conclusion' "$RUNNER_TEMP/deploy-run.json")
              if [[ "$conclusion" == success ]]; then
                echo "Site deployed: $run_url"
                exit 0
              fi
              echo "::error::Site deployment ended with $conclusion. See $run_url"
              exit 1
            fi
          else
            # Repository-scoped tokens may lack access to the central repo; it is public.
            if [[ "$status" == 403 || "$status" == 404 ]]; then auth=(); fi
            failures=$((failures + 1))
            if (( failures >= 3 )); then
              echo "::error::Deployment result unconfirmed after 3 unsuccessful status checks (HTTP $status). See $run_url"
              exit 1
            fi
          fi
          sleep 20
        done
        echo "::error::Deployment result unconfirmed after 15 minutes. Check $run_url before retrying."
        exit 1
